name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # --frozen, not a plain sync: this asserts the committed uv.lock is
      # self-sufficient in a checkout that has no sibling ../beheaxi. That is
      # the exact breakage a public clone would hit, and the reason
      # [tool.uv.sources] was dropped — so CI has to fail if it comes back.
      - name: Sync dependencies from the committed lockfile
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest -q

      # Exits non-zero if any AXI check fails, failing this step.
      - name: Conformance (dogfood the harness standard)
        run: uv run beheaxi conformance "beherouter" --json

  # The chart is the Kubernetes deployment surface; lint + schema-validate it
  # with the same scenarios used locally (charts/beherouter/ci/*.yaml).
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Lint chart (all ci/ scenarios)
        run: |
          for f in charts/beherouter/ci/*.yaml; do
            helm lint charts/beherouter -f "$f"
          done

      - name: Render and schema-validate
        run: |
          for f in charts/beherouter/ci/*.yaml; do
            helm template beherouter charts/beherouter -f "$f" | kubeconform -strict -summary
          done

      # ci/minimal.yaml is the one-value install (token only). It must render
      # against the PUBLISHED image default, in both the Deployment and the
      # registry-lint hook -- that default is what makes the chart usable
      # without building anything.
      - name: Minimal install uses the published image
        run: |
          imgs=$(helm template beherouter charts/beherouter -f charts/beherouter/ci/minimal.yaml \
            | grep -c 'ghcr.io/behemotion/beherouter:')
          [ "$imgs" -ge 2 ] || { echo "expected Deployment + lint hook on the default image, got $imgs"; exit 1; }

      - name: Defaults must refuse to render (no gateway token)
        run: |
          if helm template charts/beherouter >/dev/null 2>&1; then
            echo "default values rendered without secret.gatewayToken"
            exit 1
          fi
          echo "OK: defaults refused with a required-values error"

  # The root Containerfile is a shipped artifact (release.yml builds the
  # published image from it); build it on every PR and main push so it cannot
  # rot between releases. Native amd64, no push.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: false
          cache-from: type=gha
