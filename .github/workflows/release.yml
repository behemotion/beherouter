name: Release

# A pushed vX.Y.Z tag is the release. This workflow is the reason the tag must
# carry its own workflow file: it runs from the tagged commit, so the release
# pipeline lands on main BEFORE the tag is cut.
on:
  push:
    tags: ['v*']

jobs:
  # Same gate as CI, on the exact revision being released -- a tag cut from an
  # untested commit must not ship an image just because main was green.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The image tag (v stripped) is the chart's default image tag and the
      # pyproject version; drift means clients pull the wrong image silently.
      - name: Tag must match pyproject version and chart appVersion
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          appVersion="$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' charts/beherouter/Chart.yaml)"
          echo "tag=${tag} pyproject=${pyproject} appVersion=${appVersion}"
          [ "$tag" = "$pyproject" ] || { echo "::error::git tag v${tag} != pyproject version ${pyproject}"; exit 1; }
          [ "$tag" = "$appVersion" ] || { echo "::error::git tag v${tag} != chart appVersion ${appVersion} (the default image tag)"; exit 1; }

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies from the committed lockfile
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest -q

      - name: Conformance (dogfood the harness standard)
        run: uv run beheaxi conformance "beherouter" --json

  # Push the multi-arch image to the public registry the chart points at by
  # default, then open the GitHub Release. Image AFTER tests, release AFTER
  # image: a failed build must leave neither.
  image:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push to GHCR
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # vX.Y.Z -> image tags X.Y.Z (the chart's appVersion convention: semver,
      # no leading v) and `latest` (the default flavor adds it on semver tags).
      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The release body is this version's CHANGELOG.md section; the generated
      # contributor appendix is appended below it by softprops.
      - name: Release body from CHANGELOG.md
        id: changelog
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            index($0, "## [" ver "]") == 1 { f = 1; next }
            /^## \[/ && f { exit }
            f { print }
          ' CHANGELOG.md > release-body.md
          grep -q '[^[:space:]]' release-body.md \
            || { echo "::error::no '## [${ver}]' section in CHANGELOG.md"; exit 1; }
          {
            echo 'body<<CHANGELOG_EOF'
            cat release-body.md
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true

  # The chart is a shipped artifact too, and until it was published a
  # Kubernetes user had to vendor the directory out of git to install it --
  # which is a fork of the deployment surface, kept in step by hand. Pushing it
  # as an OCI artifact to the registry that already holds the image makes
  # `helm install oci://...` the whole install.
  #
  # AFTER the image job: the chart's default image tag is its own appVersion,
  # so publishing a chart whose image does not exist yet would hand a user a
  # release that cannot pull.
  chart:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      # A published chart version is immutable by convention here: overwriting
      # one would change what an existing pin resolves to. Chart.yaml's own
      # rule is "bump on any template/values change" -- this is what enforces it.
      - name: Chart version must not already be published
        run: |
          chartver="$(sed -n 's/^version: \(.*\)$/\1/p' charts/beherouter/Chart.yaml)"
          echo "chart version ${chartver}"
          if helm show chart "oci://ghcr.io/${{ github.repository_owner }}/charts/beherouter" \
               --version "$chartver" >/dev/null 2>&1; then
            echo "::error::chart ${chartver} is already published; bump version in charts/beherouter/Chart.yaml"
            exit 1
          fi

      - name: Package and push
        run: |
          chartver="$(sed -n 's/^version: \(.*\)$/\1/p' charts/beherouter/Chart.yaml)"
          helm package charts/beherouter --destination dist
          helm push "dist/beherouter-${chartver}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"
