apiVersion: v1
kind: Pod
metadata:
  name: {{ include "beherouter.fullname" . }}-test-connection
  labels:
    {{- include "beherouter.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      # /healthz is deliberately unauthenticated, so the test needs no token --
      # and asserts the payload, not just a 200.
      image: curlimages/curl:8.11.1
      imagePullPolicy: IfNotPresent
      command: ["sh", "-ec"]
      args:
        - |
          curl -fsS --max-time 10 "http://{{ include "beherouter.fullname" . }}:{{ .Values.service.port }}/healthz" \
            | tee /dev/stderr \
            | grep -q '"status":"ok"'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
