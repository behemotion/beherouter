apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "beherouter.fullname" . }}
  labels:
    {{- include "beherouter.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    # An attach failure (bad registry, missing ${VAR}) crash-loops the NEW pod;
    # with maxUnavailable=0 the old revision keeps serving and /healthz stays up
    # while the rollout stalls. Kubernetes turns the podman "dead gateway"
    # failure mode into "stuck rollout, previous revision still serving".
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "beherouter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "beherouter.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Registry and secret edits roll the pods even when the image is
        # unchanged -- the gateway reads both only at boot. With hotReload the
        # gateway polls the registry instead, so a registry edit must NOT roll.
        {{- if not .Values.hotReload.enabled }}
        checksum/configmap-registry: {{ include (print .Template.BasePath "/configmap-registry.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.secret.create }}
        checksum/secret-env: {{ include (print .Template.BasePath "/secret-env.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "beherouter.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- $psc := deepCopy .Values.podSecurityContext }}
      {{- if and .Values.killswitch.enabled (not (hasKey $psc "fsGroup")) }}
      {{- $_ := set $psc "fsGroup" 1000 }}
      {{- end }}
      securityContext:
        {{- toYaml $psc | nindent 8 }}
      {{- with (include "beherouter.initContainers" . | trim) }}
      initContainers:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: beherouter
          image: "{{ include "beherouter.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "beherouter.env" (dict "root" . "secretName" (include "beherouter.secretName" .) "tokenKey" (include "beherouter.tokenKey" .)) | nindent 12 }}
            {{- if and .Values.admin.token (not .Values.secret.create) }}
            {{- fail "admin.token needs secret.create=true (it is stored in the chart Secret); with secret.create=false, leave admin.token empty and supply BEHEROUTER_ADMIN_TOKEN through extraEnv from your own Secret" }}
            {{- end }}
            {{- if .Values.admin.token }}
            # The chart Secret is delivered key by key, like secret.env.
            - name: BEHEROUTER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "beherouter.secretName" . }}
                  key: BEHEROUTER_ADMIN_TOKEN
            {{- end }}
            {{- if .Values.admin.role }}
            - name: BEHEROUTER_ADMIN_ROLE
              value: {{ .Values.admin.role | quote }}
            {{- end }}
            {{- if .Values.killswitch.enabled }}
            - name: BEHEROUTER_KILLSWITCH_PATH
              value: {{ printf "%s/killswitch.json" .Values.killswitch.mountPath | quote }}
            {{- end }}
            {{- if .Values.hotReload.enabled }}
            - name: BEHEROUTER_REGISTRY_WATCH_S
              value: {{ .Values.hotReload.watchSeconds | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 47100
              protocol: TCP
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: registry
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with (include "beherouter.sharedVolumeMounts" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if .Values.identityMap.enabled }}
            # subPath + items, never a bare directory mount: the map is a single
            # file, and mounting a directory at its path would make that path a
            # directory and every lookup Unavailable.
            - name: identity-map
              mountPath: {{ .Values.identityMap.mountPath }}
              subPath: {{ base .Values.identityMap.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.killswitch.enabled }}
            - name: killswitch
              mountPath: {{ .Values.killswitch.mountPath }}
            {{- end }}
      volumes:
        - name: registry
          configMap:
            name: {{ include "beherouter.fullname" . }}-registry
        - name: tmp
          emptyDir: {}
        {{- with (include "beherouter.sharedVolumes" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if .Values.identityMap.enabled }}
        - name: identity-map
          secret:
            secretName: {{ required "identityMap.secretName is required when identityMap.enabled" .Values.identityMap.secretName }}
            items:
              - key: {{ base .Values.identityMap.mountPath }}
                path: {{ base .Values.identityMap.mountPath }}
        {{- end }}
        {{- if .Values.killswitch.enabled }}
        - name: killswitch
          persistentVolumeClaim:
            claimName: {{ required "killswitch.existingClaim is required when killswitch.enabled=true" .Values.killswitch.existingClaim }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
