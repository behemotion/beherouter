apiVersion: v1
kind: Service
metadata:
  name: {{ include "beherouter.fullname" . }}
  labels:
    {{- include "beherouter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.sessionAffinity }}
  # MCP sessions are in-process; see values.yaml before removing this.
  sessionAffinity: {{ . }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "beherouter.selectorLabels" . | nindent 4 }}
