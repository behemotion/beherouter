{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "beherouter.fullname" . }}
  labels:
    {{- include "beherouter.labels" . | nindent 4 }}
spec:
  # Ingress only, on purpose: egress must stay open because backends live
  # anywhere (remote HTTP APIs, stdio children talk to Plane on another host).
  # This is the Kubernetes translation of the podman posture -- the gateway
  # bound loopback and only the edge proxy could reach it.
  podSelector:
    matchLabels:
      {{- include "beherouter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 47100
{{- end }}
