{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "beherouter.fullname" . }}-env
  labels:
    {{- include "beherouter.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The gateway refuses to boot without the token (SharedTokenVerifier is
  # strict on purpose), so refuse at render time instead of crash-looping.
  BEHEROUTER_GATEWAY_TOKEN: {{ required "secret.gatewayToken is required when secret.create=true (or set secret.create=false and point existingSecret.name at a Secret you manage)" .Values.secret.gatewayToken | quote }}
  {{- range $key, $value := .Values.secret.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
