{{- if and .Values.preDeployLint.enabled .Values.secret.create -}}
{{/* Hook-owned copy of the credentials, for the same reason as the hook
       ConfigMap above: parity with the environment that will actually serve,
       so ${VAR} placeholders are RESOLVED, not assumed. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "beherouter.fullname" . }}-registry-lint
  labels:
    {{- include "beherouter.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: "pre-install,pre-upgrade"
    helm.sh/hook-weight: "-2"
    helm.sh/hook-delete-policy: "before-hook-creation,hook-succeeded"
type: Opaque
stringData:
  BEHEROUTER_GATEWAY_TOKEN: {{ required "secret.gatewayToken is required when secret.create=true (or set secret.create=false and point existingSecret.name at a Secret you manage)" .Values.secret.gatewayToken | quote }}
  {{- range $key, $value := .Values.secret.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
