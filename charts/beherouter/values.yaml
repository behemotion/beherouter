# beherouter chart values.
#
# The gateway is stateless (docs/DEPLOYMENT.md): the registry is the only
# config and every secret is an environment variable expanded at attach time.
# ONE value is REQUIRED for a working install:
#   secret.gatewayToken       -- $BEHEROUTER_GATEWAY_TOKEN; the gateway refuses to boot without it
#                                (or set secret.create=false + existingSecret.name to bring your own)

replicaCount: 1
# >1 replica works (each pod attaches its own backends, stdio children included),
# but MCP sessions are in-process: every replica needs client affinity (see
# service.sessionAffinity) and each one re-attaches, so a stdio backend means N
# subprocesses. Keep 1 unless you need the availability.

image:
  # The published image; every release tag exists there (git tag vX.Y.Z ->
  # image tag X.Y.Z, which is also this chart's default image tag). Override
  # only for a registry mirror or a self-built image (e.g. to add a stdio
  # backend's binary -- see the chart README's caveats).
  repository: ghcr.io/behemotion/beherouter
  tag: ""                   # defaults to the chart's appVersion
  pullPolicy: IfNotPresent  # set Always if you deploy floating tags
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # The gateway never talks to the Kubernetes API; pods set
  # automountServiceAccountToken: false regardless of this name.
  name: ""

podAnnotations: {}
podLabels: {}

# --- credentials -------------------------------------------------------------
#
# One Secret carries the shared gateway token plus every backend credential the
# registry references as ${VAR}. Nothing is ever written into registry.toml.

secret:
  # true: chart renders the Secret from gatewayToken + env below.
  # false: chart references an existing Secret instead (external-secrets,
  # sealed-secrets, anything that materialises keys before the release runs --
  # remember the ordering rule: an entry may not ship before its secret exists).
  create: true
  # $BEHEROUTER_GATEWAY_TOKEN. REQUIRED when create=true. Never commit a real
  # value; pass it with --set-secret / -f / your CD tool.
  gatewayToken: ""
  # Backend credentials keyed by the exact ${VAR} name the registry uses, e.g.:
  #   BEHEROUTER_PLANE_API_KEY: "plane-pat"
  env: {}

# Used only when secret.create=false: an existing Secret holding the gateway
# token under gatewayTokenKey. Backend ${VAR}s then arrive via extraEnv below.
existingSecret:
  name: ""
  gatewayTokenKey: BEHEROUTER_GATEWAY_TOKEN

# --- registry ----------------------------------------------------------------
#
# registry.toml verbatim. Attached surfaces and their overrides live here;
# `beherouter plugin-config <surface> <plugin>` emits the block. An EMPTY
# registry is valid -- a parked gateway still answers /healthz.
registry: ""
# Example:
#   registry: |
#     [office]
#     plugin = "office-mcp"
#
#     [plane]
#     plugin = "plane"
#       [plane.config]
#       workspace_slug = "acme"
#       [plane.env]
#       api_key = "${BEHEROUTER_PLANE_API_KEY}"
#
# (`plane` is a stdio plugin; the published image ships its plane-mcp-server.)
#
# ⚠️ BEHEROUTER_PLANE_API_KEY, not BEHEROUTER_PLANE_TOKEN. The first is the
# BACKEND credential (`beherouter plugin-config` emits exactly this name); the
# second is what `beherouter client-config` builds for a CLIENT's gateway
# bearer. Using one name for both collides two unrelated secrets, and the
# symptom is a 401 with nothing to point at.

# BEHEROUTER_PUBLIC_URL -- the published origin `client-config` emits. Empty
# auto-derives https://<first ingress host> when ingress is enabled (http when
# no TLS block is set). Set it explicitly when clients see a different origin
# than the Ingress (e.g. behind an external proxy).
publicURL: ""

# --- auth --------------------------------------------------------------------
#
# mode: "shared" (default), "oidc", or "both". "both" keeps the shared token
# working for clients that cannot mint a JWT while accepting user JWTs from
# those that can. oidc/both require issuer, audience and jwksUri -- the JWKS URI
# is never discovered from the issuer (a boot-time fetch would take /healthz
# down with the IdP).
#
# rolesClaim is the dotted path to the claim your IdP puts roles in
# (realm_access.roles on Keycloak, roles on Entra, groups elsewhere). It has no
# default, and a surface with [surface.authz] require_roles refuses to boot
# without it.
auth:
  mode: "shared"
  oidc:
    issuer: ""
    audience: ""
    jwksUri: ""
    requiredScopes: ""
    rolesClaim: ""

# --- identity map ------------------------------------------------------------
#
# Only for surfaces using identity mode "lookup". Mount an existing Secret
# read-only; the gateway re-reads it when it changes, so rotating a user's
# credential needs no restart. Never rendered into the chart.
#
# ⚠️ The Secret's KEY must be the basename of mountPath (identity-map.toml by
# default): the file is mounted with subPath, so the key is the filename.
#
# ⚠️ A subPath mount does NOT hot-reload when the Secret changes -- kubelet
# updates the projected directory, not a subPath'd file -- so on Kubernetes
# rotating a credential needs a pod restart. See docs/IDENTITY.md.
identityMap:
  enabled: false
  secretName: ""
  mountPath: "/etc/beherouter/identity-map.toml"

# --- admin API (reload, kill switch) ------------------------------------------
#
# Off unless one is set. token -> the chart Secret's BEHEROUTER_ADMIN_TOKEN;
# with secret.create=false a token here FAILS the render: leave it empty and
# supply BEHEROUTER_ADMIN_TOKEN through extraEnv instead. It must differ from
# secret.gatewayToken or the gateway refuses to boot. role -> a verified JWT
# with this role may use /admin; needs auth.mode oidc|both and rolesClaim.
# No ingress path is rendered for /admin: expose it to the admin network only.
admin:
  token: ""
  role: ""

# --- kill switch ----------------------------------------------------------------
#
# State file on a PersistentVolumeClaim you provide. ⚠️ ReadWriteMany when
# replicaCount > 1, or replicas disagree about who is blocked. The pod gets
# fsGroup 1000 unless podSecurityContext sets one, so the gateway can write it.
killswitch:
  enabled: false
  existingClaim: ""
  mountPath: /var/lib/beherouter

# --- secret files ---------------------------------------------------------------
#
# An existing Secret mounted as a DIRECTORY for ${file:/run/secrets/beherouter/<key>}
# registry values. ⚠️ Never subPath: kubelet updates a projected directory, not a
# subPath'd file, and rotation without a restart is the whole point.
# The registry-lint hook mounts it too (it resolves every ${file:}), so the
# Secret must exist BEFORE `helm install`: the hook runs pre-install and the
# chart does not create it.
secretFiles:
  enabled: false
  secretName: ""
  mountPath: /run/secrets/beherouter

# --- hot reload -----------------------------------------------------------------
#
# true: a registry ConfigMap edit is applied in place (the gateway polls it)
# instead of rolling the pods. Changed surfaces re-attach; others keep their
# sessions.
hotReload:
  enabled: false
  watchSeconds: 30

# --- private CA ----------------------------------------------------------------
#
# For an IdP (auth.mode oidc|both fetches JWKS over TLS) or a backend behind a
# private CA. ⚠️ Without it every JWT fails verification while the shared-token
# path stays green, so health --deep does not show it.
#
# An init container concatenates systemBundle with the PEMs from an existing
# ConfigMap into an emptyDir; the gateway gets SSL_CERT_FILE (httpx, uv) and
# REQUESTS_CA_BUNDLE (requests: the Plane SDK in a stdio child) pointing at the
# result. The system bundle is KEPT, so public endpoints still verify.
caBundle:
  enabled: false
  configMap: ""          # existing ConfigMap holding PEMs
  keys: []               # keys to append; empty = every key in the ConfigMap
  systemBundle: /etc/ssl/certs/ca-certificates.crt

# --- out-of-tree plugins -------------------------------------------------------
#
# `beherouter.plugins` entry points must be installed in the GATEWAY's own
# environment (a --with on a stdio surface's cmd reaches only that child). An
# init container installs these into an emptyDir on PYTHONPATH, for the gateway
# AND the registry-lint hook, so lint validates the registry against the same
# plugins that will serve. Pin exact versions.
#
# Shared dependencies are pinned to the gateway's own versions: a plugin that
# needs a different httpx or fastmcp fails its install, before the pod starts,
# instead of silently shadowing the gateway's (see beherouter.plugininstall).
# ⚠️ This makes the package index a POD-START dependency. For an air-gapped
# cluster, mirror it (indexUrl) or build an image instead.
plugins:
  install: []             # e.g. ["acme-beherouter-crm==0.1.0"]
  indexUrl: ""            # optional; replaces PyPI (uv's default index)
  # Optional Secret with keys `username` and `password` for indexUrl.
  indexCredentialsSecret: ""
  path: /opt/beherouter/plugins
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# Generic escape hatches, rendered into the Deployment AND the registry-lint
# hook Job (a hook that cannot see an init-container-installed plugin would
# refuse a registry naming it). Init containers run after the chart's own
# (caBundle, plugins).
extraInitContainers: []
extraVolumes: []
extraVolumeMounts: []

# Extra env appended verbatim to the gateway container AND the registry-lint
# hook Job: {name, value} or {name, valueFrom}. This is the escape hatch for
# credentials from ExternalSecrets/Reloader and for anything BEHE_<LAYER>_.
# Logging, audit and call-timeout knobs (docs/DEPLOYMENT.md § Logs, audit and
# metrics) are plain env vars, all optional:
#   - {name: BEHEROUTER_LOG_FORMAT, value: json}         # text (default) | json
#   - {name: BEHEROUTER_AUDIT, value: "on"}              # on (default) | off
#   - {name: BEHEROUTER_AUDIT_CLAIMS, value: "email,preferred_username"}
#   - {name: BEHEROUTER_CALL_TIMEOUT_S, value: "120"}    # unset = no limit
extraEnv: []

# --- pre-deploy gate ---------------------------------------------------------
#
# The docs' rule is "run registry-lint inside the image that is about to serve,
# against the real environment". The chart does exactly that: a
# pre-install/pre-upgrade hook Job running the SAME image with the SAME env
# against the SAME registry text. Lint failure fails the release before any pod
# is touched.
preDeployLint:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# --- scheduled deep health ---------------------------------------------------
#
# /healthz stays green through a revoked backend credential (catalogues are
# served from the attach-time cache); only `beherouter health --deep` calls each
# backend's probe. This CronJob runs it on a schedule with the gateway's own
# env, Secret, registry, plugins and CA bundle, and writes a node_exporter
# textfile-collector file (`--textfile`) -- metric contract and alert rules in
# contrib/health-textfile/README.md.
#
# The file lands on ONE node through a hostPath, read by the node_exporter pod
# on that node: pin the Job with nodeSelector (kubernetes.io/hostname: <node>)
# so successive runs overwrite one file instead of leaving a stale copy on every
# node a run ever landed on. The directory must exist and be writable by
# podSecurityContext.runAsUser (1000).
#
# Exit 6 (a red sweep, already in the file) counts as Job success, so a failed
# Job means "the sweep could not run" -- alert on staleness for that.
# With networkPolicy egress restrictions of your own, allow this Job the same
# egress the gateway pods have.
healthCronJob:
  enabled: false
  schedule: "*/5 * * * *"
  textfile:
    # REQUIRED when enabled: node_exporter's --collector.textfile.directory.
    hostPath: ""            # e.g. /var/lib/node_exporter/textfile_collector
    fileName: beherouter.prom
  # Optional per-user probe (`--bearer-file`): an existing Secret holding a
  # token for a dedicated monitoring identity. ⚠️ An IdP JWT expires; the
  # user_probe series then reads `rejected` -- refresh the Secret (e.g. with an
  # ExternalSecret minting a client-credentials token) faster than it expires.
  bearerFile:
    secretName: ""
    key: ""
  startingDeadlineSeconds: 120
  activeDeadlineSeconds: 240
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  nodeSelector: {}
  #   kubernetes.io/hostname: node-running-node-exporter
  tolerations: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

service:
  type: ClusterIP
  port: 80
  # MCP sessions live in the pod (FastMCP session managers), so requests from
  # one client must keep hitting one pod. ClientIP affinity makes replicaCount>1
  # safe; it is harmless at replicaCount=1.
  sessionAffinity: ClientIP

ingress:
  enabled: false
  className: ""   # e.g. nginx; omit to accept the cluster default
  annotations: {}
    # NOTE: a plain Ingress routes but does NOT authenticate. On the podman
    # deployment Caddy is the per-CLIENT token boundary (per-surface allow
    # clauses); in Kubernetes that boundary is whatever you put in front --
    # forward-auth/oauth2-proxy via annotations, or a Gateway with auth filters.
    # The gateway's own shared token is always enforced in-app either way.
  hosts:
    - host: beherouter.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# The podman posture (loopback bind + default-deny proxy) translates to a
# NetworkPolicy: no ingress except the sources you list. Disabled by default
# because the right selectors are cluster-specific; flip it on once they match.
networkPolicy:
  enabled: false
  # `from` blocks of an ingress rule (podSelector/namespaceSelector/ipBlock).
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx

# --- workload shape ----------------------------------------------------------

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Probes hit GET /healthz -- deliberately unauthenticated, and deliberately NOT
# a backend fan-out (a slow backend must not become a gateway alarm). startup
# gets minutes, not seconds: attach spawns stdio children and lists catalogues.
startupProbe:
  enabled: true
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 36 # 3 min
livenessProbe:
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  # The gateway writes nothing; /tmp is an emptyDir for stdio children that
  # need scratch space (Python skips bytecode it cannot write).
  readOnlyRootFilesystem: true

terminationGracePeriodSeconds: 30
revisionHistoryLimit: 3

# Horizontal scaling is supported but rarely what you want here: replicas add
# stdio subprocesses and depend on ClientIP affinity. Off by default.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 0

nodeSelector: {}
tolerations: []
affinity: {}
