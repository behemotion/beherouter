[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beherouter"
# Versioning: bump the PATCH register by default; MINOR moves only on an
# explicit ask. A release additionally needs chart appVersion + the v-tag
# (release.yml enforces all three agree). See AGENTS.md "Releases".
version = "0.2.5"
description = "Multi-service MCP gateway: per-service surfaces + embeddings-free BM25 tool search + per-user header passthrough"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Behemotion" }]
keywords = ["mcp", "gateway", "fastmcp", "tool-search", "bm25"]

dependencies = [
    # FastMCP 3.x: the plan targeted >=2.0.0, but 3.x changed `mount()` to
    # `mount(server, namespace=)` and rejects `**kwargs` tool functions, so the
    # surface builder is written against 3.x only. See docs/FASTMCP-NOTES.md.
    "fastmcp>=3.4,<4",
    # v0.1.1 is the FLOOR, not a preference: v0.1.0 catches only one of the two
    # importable ClickException classes, and this venv has both (FastMCP pulls
    # standalone click in alongside Typer's vendored copy), so under v0.1.0 usage
    # errors exit 1 instead of 2 and `beheaxi conformance "beherouter"` fails.
    # v0.1.2 is the first release that also carries LICENSE and NOTICE, which
    # Apache 2.0 §4(d) requires to reach downstream consumers.
    "beheaxi @ git+https://github.com/behemotion/beheaxi@v0.1.2",
    "rank-bm25>=0.2.2",
    # Fuzzy tier for tool search. Lexical edit distance, NOT embeddings — the
    # no-embeddings constraint in AGENTS.md is unaffected.
    "rapidfuzz>=3.9.0",
    # /metrics: counters, a latency histogram and gauges in the standard
    # exposition format. Replaces a hand-rolled collections.Counter.
    "prometheus-client>=0.20",
    "jsonschema>=4.0.0",
    "httpx>=0.27.0",
    # OpenAPI documents are YAML as often as JSON (the openapi plugin).
    "pyyaml>=6",
    "uvicorn>=0.30.0",
    # `attach`/`detach` rewrite registry.toml; a round-tripping writer keeps the
    # operator's comments and layout instead of regenerating the file.
    "tomlkit>=0.13",
]

[project.scripts]
beherouter = "beherouter.cli.app:main"

# The pinned `beheaxi @ git+...` dependency above is a PEP 508 direct reference;
# hatchling refuses those unless explicitly allowed.
[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13",
    "types-PyYAML>=6",
    "types-jsonschema>=4",
    "pytest-cov>=5",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Beyond ruff's default (E4/E7/E9/F, roughly pyflakes): full pycodestyle incl.
# E501 so `line-length` is actually enforced, import order, pyupgrade, bugbear,
# the ruff-specific set, perflint, simplify, and ASYNC + BLE — this codebase is
# async end to end, and the e2e per-file ignores below name ASYNC/BLE rules.
select = ["E", "F", "W", "I", "B", "UP", "RUF", "PERF", "SIM", "ASYNC", "BLE"]
# `×` and `∪` are used deliberately in prose (dimensions, set union).
allowed-confusables = ["×", "∪"]

[tool.ruff.lint.isort]
known-first-party = ["beherouter"]

# tests/e2e/ is a deployment DRIVER, not library code. It makes blocking HTTP
# and `podman exec` calls from one async main on purpose — it scripts a stack
# and asserts on it, and concurrency there would only hide ordering — and it
# catches broad exceptions because what it asserts is the message a caller
# would see, whatever type carried it.
[tool.ruff.lint.per-file-ignores]
"tests/e2e/*" = ["ASYNC210", "ASYNC221", "BLE001"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
# Body-checking for every function, annotated or not; the untyped seams
# (`validate(config: dict)`, `policy_from_entry(entry, spec)`) stay Any-typed
# at the boundary instead of being forced into `disallow_untyped_defs`.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

# Untyped third-party packages (no inline types, no stubs).
[[tool.mypy.overrides]]
module = ["rank_bm25", "beheaxi", "beheaxi.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["beherouter"]
branch = true
omit = ["tests/e2e/*"]

[tool.coverage.report]
# The ONE coverage floor: CI runs plain `pytest --cov=beherouter` and relies on
# this. 100% line and branch since 2026-10-10: a change brings its own tests.
# Never lower it to make a change pass; a genuinely unreachable line takes a
# `# pragma: no cover` (or `no branch`) with its reason, never a blanket exclude.
fail_under = 100
show_missing = false
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
